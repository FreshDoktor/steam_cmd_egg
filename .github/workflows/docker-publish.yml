name: Build & Publish dotnet_8_steamcmd

on:
  push:
    branches:
      - main
    paths:
      - "yolks/dotnet_8_steamcmd/Dockerfile"
      - ".github/workflows/docker-publish.yml"
  schedule:
    # Sonntags 03:00 UTC — Rebuild fängt Updates der Base-Image
    # (ghcr.io/parkervcp/yolks:dotnet_8) und der apt-Pakete auf
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/yolks

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dotnet_8_steamcmd

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: yolks/dotnet_8_steamcmd
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
